<!DOCTYPE html>
<html lang="{{ site.lang | default: 'es-AR' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    <!-- Cargamos los estilos por defecto que ya usa GitHub para tu documentación -->
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <style>
        /* Fondo negro puro de PlayStation 2 */
        body {
            background-color: #000000 !important;
            color: #ffffff !important;
            margin: 0;
        }
        /* Faint CRT scanline overlay (Efecto de líneas de TV vieja como POPSLoader) */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 60;
            opacity: 0.08;
            background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.15) 0 1px, transparent 1px 3px);
        }
        /* Contenedor transparente para que resalten las esferas de fondo */
        .container-lg {
            background: rgba(12, 12, 12, 0.85) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-radius: 4px;
            padding: 30px !important;
            margin-top: 40px !important;
            margin-bottom: 40px !important;
            position: relative;
            z-index: 2; /* Por encima de las órbitas */
            box-shadow: 0 10px 40px rgba(0,0,0,0.95);
        }
        /* Ajuste de colores de la documentación estilo PS2 */
        h1, h2, h3 { color: #38bdf8 !important; border-bottom: 1px solid rgba(145, 190, 255, 0.15) !important; }
        a { color: #7dd3fc !important; text-decoration: none; }
        a:hover { color: #ffffff !important; text-shadow: 0 0 8px rgba(125, 211, 252, 0.5) !important; }
        code { background-color: #0c1630 !important; color: #ffd79e !important; border: 1px solid rgba(145, 190, 255, 0.2) !important; }
        .markdown-body table th { background-color: #1a2c5a !important; color: #ffffff !important; }
        .markdown-body table tr { background-color: #0c1630 !important; }
        .markdown-body table tr:nth-child(even) { background-color: #142245 !important; }

        /* El Canvas interactivo ocupando el fondo completo */
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1;
        }
    </style>
</head>
<body>

    <!-- El lienzo de las 7 esferas auténticas de la consola -->
    <canvas id="ps2Canvas"></canvas>

    <!-- Inyección automática del contenido de tu README.md -->
    <div class="container-lg px-3 my-5 markdown-body">
        {{ content }}
    </div>

    <script>
        const canvas = document.getElementById('ps2Canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
        let isMoving = false;
        let idleTimer;

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            isMoving = true;

            clearTimeout(idleTimer);
            idleTimer = setTimeout(() => {
                isMoving = false;
            }, 400);
        });

        // Configuración exacta de las 7 esferas con su rol geométrico
        const orbs = [
            { type: 'triangle',  x: mouse.x, y: mouse.y, baseRadius: 5, color: '45, 212, 191',  baseEase: 0.06,  angle: 0 }, // ▲ Verde Turquesa
            { type: 'circle',    x: mouse.x, y: mouse.y, baseRadius: 5, color: '255, 94, 116',  baseEase: 0.045, angle: 0 }, // ● Rojo/Fucsia
            { type: 'cross1',    x: mouse.x, y: mouse.y, baseRadius: 5, color: '96, 165, 250',  baseEase: 0.035, angle: 0 }, // ✖ Azul Claro 1
            { type: 'cross2',    x: mouse.x, y: mouse.y, baseRadius: 5, color: '96, 165, 250',  baseEase: 0.025, angle: 0 }, // ✖ Azul Claro 2
            { type: 'square',    x: mouse.x, y: mouse.y, baseRadius: 5, color: '232, 121, 249', baseEase: 0.02,  angle: 0 }, // ■ Rosa/Violeta
            { type: 'outer1',    x: mouse.x, y: mouse.y, baseRadius: 4, color: '255, 255, 255', baseEase: 0.015, angle: 0 }, // Centro Blanco (Anillo)
            { type: 'outer2',    x: mouse.x, y: mouse.y, baseRadius: 4, color: '56, 189, 248',  baseEase: 0.01,  angle: Math.PI } // Accent Cyan (Anillo)
        ];

        let globalTime = 0;

        function animate() {
            // Estela larga en reposo para que las figuras se dibujen perfectamente en el aire
            ctx.fillStyle = isMoving ? 'rgba(0, 0, 0, 0.14)' : 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            globalTime += 0.02;

            // --- ROTACIÓN DINÁMICA DE TAMAÑOS ---
            orbs.forEach((orb, i) => {
                const sizePulse = Math.sin(globalTime * 0.8 + i * 1.5);
                orb.radius = orb.baseRadius * (1.1 + sizePulse * 0.5);
            });

            // Ordenamiento por cercanía al mouse en seguimiento
            orbs.forEach(orb => {
                const dx = mouse.x - orb.x;
                const dy = mouse.y - orb.y;
                orb.distanceToMouse = Math.sqrt(dx * dx + dy * dy);
            });
            const sortedOrbs = [...orbs].sort((a, b) => a.distanceToMouse - b.distanceToMouse);
            sortedOrbs.forEach((orb, index) => {
                orb.currentEase = orbs[index].baseEase;
            });

            // --- MOTOR DE FÍSICA Y GEOMETRÍA ---
            orbs.forEach((orb) => {
                let targetX, targetY;

                if (isMoving) {
                    // MODO SEGUIMIENTO: Fila india fluida directo al cursor
                    orb.angle += 0.02;
                    targetX = mouse.x + Math.sin(orb.angle) * 3;
                    targetY = mouse.y + Math.cos(orb.angle) * 3;
                } else {
                    // MODO REPOSO: Comportamiento geométrico según control de joystick
                    const size = 30; // Tamaño del dibujo de cada botón
                    orb.angle += 0.04; // Velocidad del dibujo interno

                    switch (orb.type) {
                        case 'triangle':
                            const triCenterX = mouse.x;
                            const triCenterY = mouse.y - 70;
                            const triAngle = orb.angle * 1.5;
                            targetX = triCenterX + size * (Math.sin(triAngle) - 0.2 * Math.sin(2 * triAngle));
                            targetY = triCenterY + size * (Math.cos(triAngle) + 0.3 * Math.cos(2 * triAngle)) * -1;
                            break;

                        case 'circle':
                            const cirCenterX = mouse.x + 70;
                            const cirCenterY = mouse.y;
                            targetX = cirCenterX + Math.cos(orb.angle) * (size * 0.9);
                            targetY = cirCenterY + Math.sin(orb.angle) * (size * 0.9);
                            break;

                        case 'square':
                            const sqCenterX = mouse.x - 70;
                            const sqCenterY = mouse.y;
                            targetX = sqCenterX + size * (Math.cos(orb.angle) - 0.08 * Math.cos(3 * orb.angle));
                            targetY = sqCenterY + size * (Math.sin(orb.angle) + 0.08 * Math.sin(3 * orb.angle));
                            break;

                        case 'cross1':
                            const crossCenterX = mouse.x;
                            const crossCenterY = mouse.y + 70;
                            const linearOsc1 = Math.sin(orb.angle) * size;
                            targetX = crossCenterX + linearOsc1;
                            targetY = crossCenterY + linearOsc1;
                            break;

                        case 'cross2':
                            const crossCenterX2 = mouse.x;
                            const crossCenterY2 = mouse.y + 70;
                            const linearOsc2 = Math.sin(orb.angle) * size;
                            targetX = crossCenterX2 - linearOsc2;
                            targetY = crossCenterY2 + linearOsc2;
                            break;

                        case 'outer1':
                        case 'outer2':
                            orb.angle += 0.01;
                            const outerRadius = 140;
                            targetX = mouse.x + Math.cos(orb.angle) * outerRadius;
                            targetY = mouse.y + Math.sin(orb.angle) * outerRadius;
                            break;
                    }
                }

                // Aplicación del suavizado LERP
                orb.x += (targetX - orb.x) * orb.currentEase;
                orb.y += (targetY - orb.y) * orb.currentEase;

                // Renderizado orgánico de luces y brillos individuales
                const pulse = 0.75 + Math.sin(globalTime * 2 + orb.baseRadius) * 0.25;
                const gradient = ctx.createRadialGradient(orb.x, orb.y, 0, orb.x, orb.y, orb.radius * 4);
                gradient.addColorStop(0, `rgba(${orb.color}, ${pulse})`);
                gradient.addColorStop(0.4, `rgba(${orb.color}, ${pulse * 0.25})`);
                gradient.addColorStop(1, `rgba(${orb.color}, 0)`);

                ctx.beginPath();
                ctx.arc(orb.x, orb.y, orb.radius * 4, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();

                ctx.beginPath();
                ctx.arc(orb.x, orb.y, orb.radius * 0.35, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${pulse * 0.95})`;
                ctx.fill();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
