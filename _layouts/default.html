<!DOCTYPE html>
<html lang="{{ site.lang | default: 'es-AR' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <style>
        body { background-color: #000000 !important; color: #ffffff !important; margin: 0; }
        body::after {
            content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 60; opacity: 0.08;
            background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.15) 0 1px, transparent 1px 3px);
        }
        .container-lg {
            background: rgba(12, 12, 12, 0.85) !important; border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-radius: 4px; padding: 30px !important; margin-top: 40px !important; margin-bottom: 40px !important;
            position: relative; z-index: 2; box-shadow: 0 10px 40px rgba(0,0,0,0.95);
        }
        h1, h2, h3 { color: #38bdf8 !important; border-bottom: 1px solid rgba(145, 190, 255, 0.15) !important; }
        a { color: #7dd3fc !important; text-decoration: none; }
        a:hover { color: #ffffff !important; text-shadow: 0 0 8px rgba(125, 211, 252, 0.5) !important; }
        code { background-color: #0c1630 !important; color: #ffd79e !important; border: 1px solid rgba(145, 190, 255, 0.2) !important; }
        .markdown-body table th { background-color: #1a2c5a !important; color: #ffffff !important; }
        .markdown-body table tr { background-color: #0c1630 !important; }
        .markdown-body table tr:nth-child(even) { background-color: #142245 !important; }
        canvas { position: fixed; top: 0; left: 0; pointer-events: none; z-index: 1; }
                        /* /// desde aca el codigo brillo Banner */
        .markdown-body p:has(img) {
            position: relative !important;
            display: block !important; /* Cambiado a block para permitir el centrado */
            text-align: center !important; /* Centra la imagen adentro del contenedor */
            margin-left: auto !important;
            margin-right: auto !important;
            overflow: hidden !important;
        }

        /* Envoltura interna para que el brillo se limite solo al ancho de la imagen centrada */
        .markdown-body p:has(img) img {
            display: inline-block !important;
        }

        /* El haz de luz animado que cruza por encima de la imagen */
        .markdown-body p:has(img)::before {
            content: "";
            position: absolute;
            top: 0;
            left: -150%;
            width: 50%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0) 10%,
                rgba(255, 255, 255, 0.45) 50%,
                rgba(255, 255, 255, 0) 90%,
                transparent
            );
            transform: skewX(-30deg);
            animation: shineSweep 5s infinite ease-in-out;
            pointer-events: none;
            z-index: 10;
        }

        @keyframes shineSweep {
            0% { left: -150%; }
            30% { left: 150%; }
            100% { left: 150%; }
        }
        /* //// Aca finaliza el codigo brillo banner */
    </style>
</head>
<body>

    <canvas id="ps2Canvas"></canvas>

    <div class="container-lg px-3 my-5 markdown-body">
        {{ content }}
    </div>
    <script>
        const canvas = document.getElementById('ps2Canvas');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();

        const mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
        let isMoving = false; let idleTimer;

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX; mouse.y = e.clientY; isMoving = true;
            clearTimeout(idleTimer); idleTimer = setTimeout(() => { isMoving = false; }, 400);
        });

        const orbs = [
            { type: 'triangle',  x: mouse.x, y: mouse.y, baseRadius: 4, color: '45, 212, 191',  baseEase: 0.06,  angle: 0 }, 
            { type: 'circle',    x: mouse.x, y: mouse.y, baseRadius: 4, color: '255, 94, 116',  baseEase: 0.045, angle: 0 }, 
            { type: 'cross1',    x: mouse.x, y: mouse.y, baseRadius: 4, color: '96, 165, 250',  baseEase: 0.035, angle: 0 }, 
            { type: 'cross2',    x: mouse.x, y: mouse.y, baseRadius: 4, color: '96, 165, 250',  baseEase: 0.025, angle: 0 }, 
            { type: 'square',    x: mouse.x, y: mouse.y, baseRadius: 4, color: '232, 121, 249', baseEase: 0.02,  angle: 0 }, 
            { type: 'outer1',    x: mouse.x, y: mouse.y, baseRadius: 3, color: '255, 255, 255', baseEase: 0.015, angle: 0 }, 
            { type: 'outer2',    x: mouse.x, y: mouse.y, baseRadius: 3, color: '56, 189, 248',  baseEase: 0.01,  angle: Math.PI } 
        ];

        let globalTime = 0;
        function animate() {
            ctx.fillStyle = isMoving ? 'rgba(0, 0, 0, 0.14)' : 'rgba(0, 0, 0, 0.02)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            globalTime += 0.02;

            orbs.forEach((orb, i) => {
                const sizePulse = Math.sin(globalTime * 0.8 + i * 1.5);
                orb.radius = orb.baseRadius * (1.1 + sizePulse * 0.5);
            });

            orbs.forEach(orb => {
                orb.distanceToMouse = Math.sqrt((mouse.x - orb.x)**2 + (mouse.y - orb.y)**2);
            });
            const sortedOrbs = [...orbs].sort((a, b) => a.distanceToMouse - b.distanceToMouse);
            sortedOrbs.forEach((orb, index) => { orb.currentEase = orbs[index].baseEase; });

            orbs.forEach((orb) => {
                let targetX, targetY;
                if (isMoving) {
                    orb.angle += 0.02;
                    targetX = mouse.x + Math.sin(orb.angle) * 3;
                    targetY = mouse.y + Math.cos(orb.angle) * 3;
                } else {
                    const size = 30; orb.angle += 0.05;
                    switch (orb.type) {
                        case 'triangle':
                            const triAngle = orb.angle * 1.5;
                            targetX = mouse.x + size * (Math.sin(triAngle) - 0.2 * Math.sin(2 * triAngle));
                            targetY = (mouse.y - 60) + size * (Math.cos(triAngle) + 0.3 * Math.cos(2 * triAngle)) * -1;
                            break;
                        case 'circle':
                            targetX = (mouse.x + 60) + Math.cos(orb.angle) * size;
                            targetY = mouse.y + Math.sin(orb.angle) * size;
                            break;
                        case 'square':
                            // Algoritmo de perfilado de bordes rectos para el Cuadrado
                            const cosS = Math.cos(orb.angle);
                            const sinS = Math.sin(orb.angle);
                            targetX = (mouse.x - 60) + size * Math.sign(cosS) * Math.pow(Math.abs(cosS), 0.3);
                            targetY = mouse.y + size * Math.sign(sinS) * Math.pow(Math.abs(sinS), 0.3);
                            break;
                        case 'cross1':
                            const osc1 = Math.sin(orb.angle) * size;
                            targetX = mouse.x + osc1; targetY = (mouse.y + 60) + osc1;
                            break;
                        case 'cross2':
                            const osc2 = Math.sin(orb.angle) * size;
                            targetX = mouse.x - osc2; targetY = (mouse.y + 60) + osc2;
                            break;
                        case 'outer1':
                            // Esfera Blanca: Gira en sentido contrario a las agujas del reloj, radio 150
                            orb.angle -= 0.04;
                            targetX = mouse.x + Math.cos(orb.angle * 2.0) * 170;
                            targetY = mouse.y + Math.sin(orb.angle * 2.0) * 170;
                            break;

                        case 'outer2':
                            // Esfera Cyan: Gira en sentido horario (espejada) y un carril más cerrada (radio 135)
                            orb.angle += 0.04; // Cambiado a += para que vaya al revés
                            targetX = mouse.x + Math.cos(orb.angle * 2.0) * 165; // Carril interno
                            targetY = mouse.y + Math.sin(orb.angle * 2.0) * 165;
                            break;
                    }
                }

                orb.x += (targetX - orb.x) * orb.currentEase;
                orb.y += (targetY - orb.y) * orb.currentEase;

                const pulse = 0.75 + Math.sin(globalTime * 2 + orb.baseRadius) * 0.25;
                const gradient = ctx.createRadialGradient(orb.x, orb.y, 0, orb.x, orb.y, orb.radius * 1.8);
                gradient.addColorStop(0, `rgba(${orb.color}, ${pulse})`);
                gradient.addColorStop(0.5, `rgba(${orb.color}, ${pulse * 0.2})`);
                gradient.addColorStop(1, `rgba(${orb.color}, 0)`);

                ctx.beginPath(); ctx.arc(orb.x, orb.y, orb.radius * 1.8, 0, Math.PI * 2); ctx.fillStyle = gradient; ctx.fill();
                ctx.beginPath(); ctx.arc(orb.x, orb.y, orb.radius * 0.3, 0, Math.PI * 2); ctx.fillStyle = `rgba(255, 255, 255, ${pulse * 0.95})`; ctx.fill();
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
