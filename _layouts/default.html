<!DOCTYPE html>
<html lang="{{ site.lang | default: 'es-AR' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    <!-- Cargamos los estilos por defecto que ya usa GitHub para tu documentación -->
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <style>
        /* Fondo negro puro de PlayStation 2 */
        body {
            background-color: #000000 !important;
            color: #ffffff !important;
            margin: 0;
        }
        /* Forzamos a que todo el contenedor de Markdown sea transparente para ver el fondo */
        .container-lg {
            background: rgba(12, 12, 12, 0.82) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-radius: 8px;
            padding: 30px !important;
            margin-top: 40px !important;
            margin-bottom: 40px !important;
            position: relative;
            z-index: 2; /* Por encima del canvas */
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
        }
        /* Ajuste de colores de títulos estilo PS2 */
        h1, h2, h3 { color: #00b4ff !important; border-bottom: 1px solid rgba(255,255,255,0.1) !important; }
        a { color: #00ffc8 !important; }
        code { background-color: #151515 !important; color: #ff0096 !important; }
        .markdown-body table th { background-color: #1a1a1a !important; }
        .markdown-body table tr { background-color: #090909 !important; }

        /* El Canvas interactivo totalmente transparente de fondo */
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1;
        }
    </style>
</head>
<body>

    <!-- El lienzo de las 7 esferas orgánicas -->
    <canvas id="ps2Canvas"></canvas>

    <!-- La inyección automática de tu contenido de GitHub Pages -->
    <div class="container-lg px-3 my-5 markdown-body">
        {{ content }}
    </div>

    <script>
        const canvas = document.getElementById('ps2Canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
        let isMoving = false;
        let idleTimer;

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            isMoving = true;

            clearTimeout(idleTimer);
            idleTimer = setTimeout(() => {
                isMoving = false;
            }, 400);
        });

                // Tus 7 microesferas calibradas con el DOBLE de retraso (valores baseEase reducidos a la mitad)
        const orbs = [
            { id: 1, x: mouse.x, y: mouse.y, radius: 6, color: 'rgba(0, 180, 255,', baseEase: 0.06, angle: 0, orbitSpeed: 0.02, orbitRadius: 35, pulseOffset: 0 },
            { id: 2, x: mouse.x, y: mouse.y, radius: 5, color: 'rgba(0, 255, 200,', baseEase: 0.045, angle: 1.5, orbitSpeed: -0.025, orbitRadius: 55, pulseOffset: 1 },
            { id: 3, x: mouse.x, y: mouse.y, radius: 5, color: 'rgba(150, 0, 255,', baseEase: 0.035, angle: 3, orbitSpeed: 0.015, orbitRadius: 75, pulseOffset: 2 },
            { id: 4, x: mouse.x, y: mouse.y, radius: 4, color: 'rgba(255, 255, 255,', baseEase: 0.025, angle: 4.5, orbitSpeed: -0.018, orbitRadius: 95, pulseOffset: 3 },
            { id: 5, x: mouse.x, y: mouse.y, radius: 4, color: 'rgba(0, 120, 255,', baseEase: 0.02, angle: 2, orbitSpeed: 0.022, orbitRadius: 115, pulseOffset: 4 },
            { id: 6, x: mouse.x, y: mouse.y, radius: 3, color: 'rgba(255, 0, 150,', baseEase: 0.015, angle: 5.5, orbitSpeed: -0.012, orbitRadius: 130, pulseOffset: 5 },
            { id: 7, x: mouse.x, y: mouse.y, radius: 3, color: 'rgba(0, 255, 100,', baseEase: 0.01, angle: 0.5, orbitSpeed: 0.017, orbitRadius: 150, pulseOffset: 6 }
        ];

        let globalTime = 0;

        function animate() {
            ctx.fillStyle = isMoving ? 'rgba(0, 0, 0, 0.14)' : 'rgba(0, 0, 0, 0.07)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            globalTime += 0.02;

            orbs.forEach(orb => {
                const dx = mouse.x - orb.x;
                const dy = mouse.y - orb.y;
                orb.distanceToMouse = Math.sqrt(dx * dx + dy * dy);
            });

            const sortedOrbs = [...orbs].sort((a, b) => a.distanceToMouse - b.distanceToMouse);

            sortedOrbs.forEach((orb, index) => {
                orb.currentEase = orbs[index].baseEase;
            });

            orbs.forEach((orb) => {
                orb.angle += orb.orbitSpeed;

                let targetX, targetY;

                if (isMoving) {
                    targetX = mouse.x + Math.sin(orb.angle) * 3;
                    targetY = mouse.y + Math.cos(orb.angle) * 3;
                } else {
                    const dynamicRadius = orb.orbitRadius + Math.sin(globalTime * 0.5 + orb.id) * 20;
                    targetX = mouse.x + Math.cos(orb.angle) * dynamicRadius;
                    targetY = mouse.y + Math.sin(orb.angle * 1.1) * dynamicRadius;
                }

                orb.x += (targetX - orb.x) * orb.currentEase;
                orb.y += (targetY - orb.y) * orb.currentEase;

                const pulse = 0.7 + Math.sin(globalTime * 1.5 + orb.pulseOffset) * 0.3;
                const currentRadius = orb.radius * (0.85 + Math.sin(globalTime + orb.pulseOffset) * 0.15);

                const gradient = ctx.createRadialGradient(orb.x, orb.y, 0, orb.x, orb.y, currentRadius * 3.5);
                gradient.addColorStop(0, orb.color + pulse + ')');
                gradient.addColorStop(0.4, orb.color + (pulse * 0.3) + ')');
                gradient.addColorStop(1, orb.color + ' 0)');

                ctx.beginPath();
                ctx.arc(orb.x, orb.y, currentRadius * 3.5, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();

                ctx.beginPath();
                ctx.arc(orb.x, orb.y, currentRadius * 0.3, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${pulse * 0.9})`;
                ctx.fill();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
