<!DOCTYPE html>
<html lang="{{ site.lang | default: 'es-AR' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    <!-- Cargamos los estilos por defecto que ya usa GitHub para tu documentación -->
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <style>
        /* Fondo negro puro de PlayStation 2 */
        body {
            background-color: #000000 !important;
            color: #ffffff !important;
            margin: 0;
        }
        /* Faint CRT scanline overlay (Efecto de líneas de TV vieja como POPSLoader) */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 60;
            opacity: 0.08;
            background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.15) 0 1px, transparent 1px 3px);
        }
        /* Contenedor transparente para que resalten las esferas de fondo */
        .container-lg {
            background: rgba(12, 12, 12, 0.85) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-radius: 4px;
            padding: 30px !important;
            margin-top: 40px !important;
            margin-bottom: 40px !important;
            position: relative;
            z-index: 2; /* Por encima de las órbitas */
            box-shadow: 0 10px 40px rgba(0,0,0,0.95);
        }
        /* Ajuste de colores de la documentación estilo PS2 */
        h1, h2, h3 { color: #38bdf8 !important; border-bottom: 1px solid rgba(145, 190, 255, 0.15) !important; }
        a { color: #7dd3fc !important; text-decoration: none; }
        a:hover { color: #ffffff !important; text-shadow: 0 0 8px rgba(125, 211, 252, 0.5) !important; }
        code { background-color: #0c1630 !important; color: #ffd79e !important; border: 1px solid rgba(145, 190, 255, 0.2) !important; }
        .markdown-body table th { background-color: #1a2c5a !important; color: #ffffff !important; }
        .markdown-body table tr { background-color: #0c1630 !important; }
        .markdown-body table tr:nth-child(even) { background-color: #142245 !important; }

        /* El Canvas interactivo ocupando el fondo completo */
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1;
        }
    </style>
</head>
<body>

    <!-- El lienzo de las 7 esferas auténticas de la consola -->
    <canvas id="ps2Canvas"></canvas>

    <!-- Inyección automática del contenido de tu README.md -->
    <div class="container-lg px-3 my-5 markdown-body">
        {{ content }}
    </div>

    <script>
        const canvas = document.getElementById('ps2Canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
        let isMoving = false;
        let idleTimer;

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            isMoving = true;

            clearTimeout(idleTimer);
            idleTimer = setTimeout(() => {
                isMoving = false;
            }, 400);
        });

        // CALIBRACIÓN AUTÉNTICA DE LAS 7 ORBS (Colores oficiales y Doble Retraso)
        const orbs = [
            { id: 1, x: mouse.x, y: mouse.y, radius: 6, color: '0, 180, 255',  baseEase: 0.06,  angle: 0,   orbitSpeed: 0.02,  orbitRadius: 15,  pulseOffset: 0 },   // Lighter Blue
            { id: 2, x: mouse.x, y: mouse.y, radius: 5, color: '45, 212, 191', baseEase: 0.045, angle: 1.5, orbitSpeed: -0.025, orbitRadius: 25,  pulseOffset: 1 },   // Triángulo Verde
            { id: 3, x: mouse.x, y: mouse.y, radius: 5, color: '96, 165, 250', baseEase: 0.035, angle: 3,   orbitSpeed: 0.015, orbitRadius: 35,  pulseOffset: 2 },   // Equis Azul
            { id: 4, x: mouse.x, y: mouse.y, radius: 4, color: '255, 255, 255', baseEase: 0.025, angle: 4.5, orbitSpeed: -0.018, orbitRadius: 45,  pulseOffset: 3 },   // Centro Blanco
            { id: 5, x: mouse.x, y: mouse.y, radius: 4, color: '232, 121, 249', baseEase: 0.02,  angle: 2,   orbitSpeed: 0.022, orbitRadius: 55, pulseOffset: 4 },   // Cuadrado Rosa
            { id: 6, x: mouse.x, y: mouse.y, radius: 3, color: '255, 94, 116',  baseEase: 0.015, angle: 5.5, orbitSpeed: -0.012, orbitRadius: 70, pulseOffset: 5 },   // Círculo Rojo
            { id: 7, x: mouse.x, y: mouse.y, radius: 3, color: '56, 189, 248',  baseEase: 0.01,  angle: 0.5, orbitSpeed: 0.017, orbitRadius: 90, pulseOffset: 6 }    // Accent Cyan
        ];

        let globalTime = 0;

        function animate() {
            // Ajustamos la densidad de la estela según el estado del cursor
            ctx.fillStyle = isMoving ? 'rgba(0, 0, 0, 0.14)' : 'rgba(0, 0, 0, 0.07)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            globalTime += 0.02;

            // Ordenamiento dinámico en base a la distancia al mouse (Fila india caótica)
            orbs.forEach(orb => {
                const dx = mouse.x - orb.x;
                const dy = mouse.y - orb.y;
                orb.distanceToMouse = Math.sqrt(dx * dx + dy * dy);
            });
            const sortedOrbs = [...orbs].sort((a, b) => a.distanceToMouse - b.distanceToMouse);
            sortedOrbs.forEach((orb, index) => {
                orb.currentEase = orbs[index].baseEase;
            });

            // Actualizar posiciones y dibujar
            orbs.forEach((orb) => {
                orb.angle += orb.orbitSpeed;
                let targetX, targetY;

                if (isMoving) {
                    targetX = mouse.x + Math.sin(orb.angle) * 3;
                    targetY = mouse.y + Math.cos(orb.angle) * 3;
                } else {
                    const dynamicRadius = orb.orbitRadius + Math.sin(globalTime * 0.5 + orb.id) * 20;
                    targetX = mouse.x + Math.cos(orb.angle) * dynamicRadius;
                    targetY = mouse.y + Math.sin(orb.angle * 1.1) * dynamicRadius;
                }

                orb.x += (targetX - orb.x) * orb.currentEase;
                orb.y += (targetY - orb.y) * orb.currentEase;

                // Pulsación orgánica del brillo
                const pulse = 0.7 + Math.sin(globalTime * 1.5 + orb.pulseOffset) * 0.3;
                const currentRadius = orb.radius * (0.85 + Math.sin(globalTime + orb.pulseOffset) * 0.15);

                // Destello exterior (Glow)
                const gradient = ctx.createRadialGradient(orb.x, orb.y, 0, orb.x, orb.y, currentRadius * 2);
                gradient.addColorStop(0, `rgba(${orb.color}, ${pulse})`);
                gradient.addColorStop(0.4, `rgba(${orb.color}, ${pulse * 0.25})`);
                gradient.addColorStop(1, `rgba(${orb.color}, 0)`);

                ctx.beginPath();
                ctx.arc(orb.x, orb.y, currentRadius * 2, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();

                // Núcleo central blanco brillante de la órbita
                ctx.beginPath();
                ctx.arc(orb.x, orb.y, currentRadius * 0.15, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${pulse * 0.95})`;
                ctx.fill();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
